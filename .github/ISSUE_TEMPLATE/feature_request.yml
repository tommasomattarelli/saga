name: Feature request
description: Propose something new for SAGA, or an improvement to what is there
labels: ["type: feature"]
body:
  - type: markdown
    attributes:
      value: |
        Search the existing issues first — if someone already asked for this, add a 👍
        rather than opening a duplicate.

        SAGA is opinionated, and much of the roadmap is already written down: skim
        [`TODO.md`](../../blob/main/TODO.md) for what is planned and the
        [ADRs](../../tree/main/docs/adr) for why things work the way they do. Not every
        request will be accepted.

        Still shaping the idea? [Discussions](../../discussions) is the better place for it.

  - type: textarea
    id: feature
    attributes:
      label: What would you like SAGA to do?
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: What is hard or impossible today?
      description: The problem behind the request. Often it has a solution nobody had thought of.

  - type: textarea
    id: notes
    attributes:
      label: Additional information
