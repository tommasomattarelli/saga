name: Bug report
description: Something in SAGA is broken or behaves wrongly
labels: ["type: bug"]
body:
  - type: markdown
    attributes:
      value: |
        Before opening a new issue, please search the existing ones. If your problem is
        already reported, add a 👍 reaction to it — no need to comment, and no need for a
        duplicate.

        If you are not reporting a bug — a question, an idea, or something that just reads
        oddly in play — post in [Discussions](../../discussions) instead.

        **Redact your API keys, tokens and passwords** from anything you paste.

  - type: input
    id: version
    attributes:
      label: Which version of SAGA are you running?
      description: The release tag, or the commit you built from.
      placeholder: v0.2.0-beta.1
    validations:
      required: true

  - type: input
    id: setup
    attributes:
      label: How did you install it, and which AI provider are you using?
      description: Rough is fine — it usually narrows the bug down more than anything else.
      placeholder: Docker Compose — OpenRouter, a :free model
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: What issue are you seeing?
      description: Include the full error message if there is one. Text rather than a screenshot, if you can.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: What steps can reproduce it?
      description: If it happened during play, the action you typed and the DM's reply are usually enough.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect instead?

  - type: textarea
    id: notes
    attributes:
      label: Additional information
      description: Backend or installer output, the world you were playing, anything else you think matters.
