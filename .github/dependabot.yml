# Two channels:
#  - Version updates (below): routine bumps, one grouped PR per ecosystem,
#    weekly — low noise.
#  - Security updates: enabled at the repo level (Dependabot alerts +
#    security updates). They open as soon as a CVE affects a dependency and
#    arrive INDIVIDUALLY (not grouped), so a critical fix is never blocked by
#    a bundled breaking change.
version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/backend"
    schedule:
      interval: "weekly"
    groups:
      all:
        applies-to: version-updates
        patterns:
          - "*"

  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
    groups:
      all:
        applies-to: version-updates
        patterns:
          - "*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      all:
        applies-to: version-updates
        patterns:
          - "*"
