name: CI

on:
  push:
    # TEMP: feat branch added to validate CI without opening a PR.
    # Revert to `branches: [main]` before merging.
    branches: [main, feat/casual-installer-ci]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend lint + unit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
          python-version: "3.12"
      - run: uv sync
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run python -m pytest tests/unit --noconftest -q

  backend-integration:
    name: Backend integration (pgvector)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: saga_test
          POSTGRES_PASSWORD: saga_test
          POSTGRES_DB: saga_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U saga_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://saga_test:saga_test@localhost:5432/saga_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
          python-version: "3.12"
      - run: uv sync
      - name: Enable pgvector extension
        run: |
          sudo apt-get update && sudo apt-get install -y postgresql-client
          PGPASSWORD=saga_test psql -h localhost -p 5432 -U saga_test -d saga_test \
            -c "CREATE EXTENSION IF NOT EXISTS vector;"
      - run: uv run python -m pytest tests/integration tests/playtest -q

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --legacy-peer-deps
      - run: npm run lint
      - run: npm run test -- --run
      - run: npm run knip
      - run: npm run build

  docker-build:
    name: Docker build smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - run: docker compose build

  installer-scripts:
    name: Installer scripts parse-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse-check PowerShell installer scripts
        shell: pwsh
        run: |
          $bad = $false
          Get-ChildItem install/*.ps1 | ForEach-Object {
            $e = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$null, [ref]$e) | Out-Null
            if ($e) { $bad = $true; Write-Host "::error file=$($_.FullName)::$($e[0].Message)" }
            else { Write-Host "[OK] $($_.Name)" }
          }
          if ($bad) { exit 1 }
