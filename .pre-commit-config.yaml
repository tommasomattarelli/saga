default_install_hook_types: [pre-commit, commit-msg, pre-push]
default_stages: [pre-commit]
minimum_pre_commit_version: "3.5.0"

repos:
  # Hygiene
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ["--maxkb=1024"]

  # Backend lint + format (ruff finds backend/pyproject.toml)
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.6
    hooks:
      - id: ruff
        args: ["--fix"]
      - id: ruff-format

  # Secret scan (std 16-18)
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks

  # Conventional Commits with mandatory scope (commit convention)
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v3.6.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
        args:
          - "--strict"
          - "--force-scope"
          - "feat"
          - "fix"
          - "refactor"
          - "test"
          - "docs"
          - "chore"
          - "perf"
          - "build"
          - "ci"

  # Project-local checks (run only when the relevant stack changes)
  - repo: local
    hooks:
      - id: frontend-eslint
        name: eslint (frontend)
        entry: bash -c 'cd frontend && npx eslint .'
        language: system
        files: ^frontend/.*\.(ts|tsx)$
        pass_filenames: false

      - id: frontend-prettier
        name: prettier --check (frontend)
        entry: bash -c 'cd frontend && npx prettier --check "src/**/*.{ts,tsx,json,css}"'
        language: system
        files: ^frontend/.*\.(ts|tsx|json|css)$
        pass_filenames: false

      - id: frontend-vitest
        name: vitest run (frontend unit)
        entry: bash -c 'cd frontend && npx vitest run'
        language: system
        files: ^frontend/.*\.(ts|tsx)$
        pass_filenames: false

      - id: backend-pytest
        name: pytest unit (backend, no infra)
        entry: bash -c 'cd backend && uv run python -m pytest tests/unit --noconftest -q'
        language: system
        files: ^backend/.*\.py$
        pass_filenames: false

      - id: frontend-tsc
        name: tsc -b (frontend typecheck)
        entry: bash -c 'cd frontend && npx tsc -b'
        language: system
        files: ^frontend/.*\.(ts|tsx)$
        pass_filenames: false
        stages: [pre-push]

      - id: backend-mypy
        name: mypy (backend typecheck)
        entry: bash -c 'cd backend && uv run mypy'
        language: system
        files: ^backend/.*\.py$
        pass_filenames: false
        stages: [pre-push]
