# Default SAGA taxonomy (ADR 0008 P0) — copy and adapt for your own world.
# Kind/terrain/mode names are yours to change; the numeric fields are the
# engine contract (scale, travel_multiplier, speed_kmh).

kinds:
  - name: world
    scale: outdoor
  - name: region
    scale: outdoor
  - name: area
    scale: outdoor
  - name: site
    scale: outdoor
    params:
      - {name: population, type: int, min: 0}
      - {name: danger, type: int, min: 0, max: 10}
  - name: building
    scale: interior
  - name: room
    scale: interior

terrains:
  - {name: road, travel_multiplier: 0.75}
  - {name: trail, travel_multiplier: 0.9}
  - {name: wilderness, travel_multiplier: 1.2}
  - {name: forest, travel_multiplier: 1.5}
  - {name: swamp, travel_multiplier: 2.0}
  - {name: mountain, travel_multiplier: 2.5}
  - {name: desert, travel_multiplier: 1.4}
  - {name: arctic, travel_multiplier: 1.8}
  - {name: coastal, travel_multiplier: 1.0}

travel_modes:
  - {name: foot, speed_kmh: 4}
  - {name: horse, speed_kmh: 7}
  - {name: ship, speed_kmh: 6}

defaults:
  terrain: wilderness
  elevation_m: 0

# NPC psychology axes (ADR 0005) — yours to change: add axes (honor, faith, ...),
# reshape bands per axis. Numeric fields are the engine contract.
psychology:
  first_impression_multiplier: 3.0
  max_delta_per_turn: 10
  axes:
    trust:
      range: [-100, 100]
      default: 0
      bands:
        - {min: -100, label: "betrayed-wary"}
        - {min: -30, label: "suspicious"}
        - {min: -10, label: "neutral"}
        - {min: 30, label: "trusting"}
        - {min: 70, label: "confides fully"}
    respect:
      range: [-100, 100]
      default: 0
      bands:
        - {min: -100, label: "contemptuous"}
        - {min: -30, label: "dismissive"}
        - {min: -10, label: "neutral"}
        - {min: 30, label: "respectful"}
        - {min: 70, label: "in awe"}
    affection:
      range: [-100, 100]
      default: 0
      bands:
        - {min: -100, label: "loathing"}
        - {min: -30, label: "cold"}
        - {min: -10, label: "neutral"}
        - {min: 30, label: "fond"}
        - {min: 70, label: "devoted"}
    fear:
      range: [-100, 100]
      default: 0
      bands:
        - {min: -100, label: "fearless of you"}
        - {min: -30, label: "at ease"}
        - {min: -10, label: "neutral"}
        - {min: 30, label: "uneasy"}
        - {min: 70, label: "terrified"}

# NPC descriptive fields (ADR 0009) — yours to change: add fields (honor_code,
# clan, ...), drop what you don't use. `scene: true` = also shown to the DM in
# the scene block; otherwise only the NPC itself sees it when speaking.
npc_fields:
  - {name: role, default: "Commoner", scene: true}
  - {name: appearance, scene: true}
  - {name: personality}
  - {name: motivation}
  - {name: background}
  - {name: ideal}
  - {name: bond}
  - {name: flaw}
  - {name: mannerisms}
  - {name: secret}
  - {name: dreads}

# NPC classes (ADR 0003) — coarse archetypes carrying the MECHANICS. The `role` trait
# above stays descriptive ("panettiere", "imperatore"); the class decides how tough
# someone is, so a butcher can never hold a general's numbers. `defense` reuses the six
# difficulty levels; hp is drawn from the hp_class range in saga.config.yaml.
# Yours to change: rename them, add your own (cultist, construct, dragon, ...).
npc_classes:
  - {name: commoner,  hp_class: weak,     defense: easy,   damage_class: unarmed}
  - {name: royale,    hp_class: weak,     defense: easy,   damage_class: light}
  - {name: beast,     hp_class: standard, defense: normal, damage_class: medium, attack_mod: 2}
  - {name: guard,     hp_class: standard, defense: normal, damage_class: medium, attack_mod: 2}
  - {name: soldier,   hp_class: standard, defense: hard,   damage_class: medium, attack_mod: 3}
  - {name: commander, hp_class: tough,    defense: hard,   damage_class: heavy,  attack_mod: 5}
