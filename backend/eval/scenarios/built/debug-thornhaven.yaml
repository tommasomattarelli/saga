history:
- role: user
  content: i run towards Lyra, swinging my knife, aiming to her neck
- role: assistant
  content: 'The charge closes the distance in a heartbeat. Your knife drives toward her throat — she twists
    her head, the blade scoring a burning line across her jaw and neck instead of opening it. Blood sprays
    hot across your knuckles. She grunts, a sound more surprise than pain, and her axe swings wild as
    she''s knocked off-balance, the heavy head shearing air where your ribs were a heartbeat before.


    You''re inside her guard now. Close enough to see the pulse hammering in her neck, the white of her
    teeth bared in something between a snarl and a grin.


    The standing stones flare brighter. Blue light washes over both of you, throwing long shadows across
    the moss. The hum rises to a keen that vibrates in your teeth.


    Lyra''s boot hooks behind your ankle — not a strike, a sweep. She''s trying to put you on the ground.


    The fire pops loud as a gunshot. Smoke stings your eyes.


    Her axe comes around again, slower this time, controlled. She''s learned your reach.'
- role: user
