    meta:
      setting: 'A verdant forest surrounds the ancient Shrine of First Light, where travelers sometimes
        awaken with no memory of how they arrived. The nearby village of Thornhaven sits at a crossroads,
        its people wary of strangers but not unkind. Dark rumors speak of something stirring in the old
        mines to the north.

        '
      world_name: The Awakening
      current_season: spring
      schema_version: 8
      current_location: bc2b4e9f-9d6b-406f-ac6a-ffa15093b6b9
      opening_narration: 'Your eyes open to a canopy of ancient oaks. Sunlight filters through the leaves
        in golden shafts, and the air smells of moss and wildflowers. You''re lying on cold stone — a
        circular platform surrounded by weathered pillars carved with symbols you almost recognize.

        Your head throbs. You remember... nothing. Not your name, not how you got here, not why your hand
        grips the hilt of a sword you don''t remember owning.

        A young woman in forest-green leather crouches nearby, watching you with sharp eyes. "Easy," she
        says, a hand raised. "You''ve been out for hours. I''m Lyra. I found you here at dawn." She glances
        at the pillars. "This place... people don''t just wake up here by accident."

        Behind her, a path winds into the forest. In the distance, you can hear the faint sound of a village
        — hammering, a rooster crowing.

        "Can you stand?" Lyra asks. "Thornhaven isn''t far. You look like you could use a meal and some
        answers."

        '
