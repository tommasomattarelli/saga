  summary_context: 'The player look around the clearing and take in the scene.. The clearing spreads in
    a rough circle, perhaps thirty paces across.

    The player ask Lyra who she is and why she is watching the shrine.. Lyra''s voice is low, pitched
    to carry no further than the stone circle.

    The player give up trying to learn who I am..

    The player No. I will not give up. I will find out who I am.. Lyra''s expression doesn''t change —
    no irritation, no sympathy, no surprise.

    The player draw my knife and lunge at Lyra, attacking her. The knife finds purchase — a glancing blow
    across her forearm as she twists, the blade catching leather and skin.'
