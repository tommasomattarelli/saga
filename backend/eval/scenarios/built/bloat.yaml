history:
- role: user
  content: I follow her onto the path.
- role: assistant
  content: 'The clearing closes behind you in a dozen steps and then is simply gone, with no sense that
    it was ever there, which bothers you more than it should. The oaks give out within a few hundred paces
    and the wood becomes a mixed stand of beech and holly, close-grown, so the light comes down green
    and shifting and you keep mistaking movement for movement.

    Lyra sets a pace that is not quite comfortable. She does not look back to see whether you are keeping
    it — she listens instead, you realise, adjusting a half-step whenever your boots come down wrong,
    and you find yourself trying to put your feet where she has put hers just to stop giving her the information.

    Off to the left and below, water goes over stone with the flat continuous sound of a shallow river
    running fast. Twice the path crosses a rut that is not a rut but a drag mark, something heavy pulled
    across the trail and away into the undergrowth, and both times she steps over it without comment and
    without slowing down.

    '
- role: user
  content: Anything living out here I should worry about?
- role: assistant
  content: 'She slows enough that you can draw level with her, which you suspect is most of the answer
    before she gives you any of it. The trail here runs along a shoulder of ground with the land dropping
    away steeply on the left into hazel scrub, and the leaf litter across the whole width of the path
    has been turned over in a broad band — recently, in the last day or two, by something that was not
    being remotely careful about it.

    She stops at the edge of the disturbed ground and looks at it for rather longer than a boar would
    warrant.



    [Lyra] Boar mostly, and they''ll leave you if you leave them. Wolves in a hard winter, but it hasn''t
    been a hard winter. Lately there''s something coming down off the mine road at night and going back
    up before light, and I don''t like the stride of it — too long between prints and too even. Whatever
    it is, it isn''t hurrying and it doesn''t get tired. (toes the turned leaf litter flat without crouching
    to it, and keeps her eyes on the upslope while she does)'
- role: user
  content: I pick up the lantern lying in the ferns.
- role: assistant
  content: 'It is a shuttered tin lantern of the sort carried on a belt hook, and the hook is still fixed
    to it by a finger''s length of leather strap gone hard and black and curled at the broken end. The
    glass is intact on all four faces, which after a winter in the ferns is close to remarkable. The shutter
    still runs in its groove, stiffly, with a small metallic complaint.

    The oil reservoir is bone dry and smells of nothing at all — not of oil, not of burning, not of the
    sourness old lamp oil leaves behind when it turns. Somebody drained it, or it burned itself out and
    then sat here long enough for even that to leave, and you have no idea how long that takes.

    The ferns have grown up through the handle. Not around it — through, three fronds threaded between
    the wire and the body of the lamp, which means it has been lying here since at least last spring.
    Whoever set it down did not come back for it, and has not come back for it since.

    '
- role: user
  content: Does the mine road cross this path?
- role: assistant
  content: 'Where the beeches thin out, the deer-track you have been walking runs into something wider
    — a proper road, or what passes for one out here, rutted deep by cartwheels through a wet season and
    then dried hard into ridges that will turn an ankle if you are careless. It runs north and south.
    To the south it drops away between banks, and you can smell woodsmoke coming up from that direction,
    faint and domestic and unmistakable.

    Lyra stops at the junction. She looks north, uphill, where the road goes into the trees and the trees
    close over it, and she looks for long enough that you start looking too.

    The southbound ruts are old and weathered and full of last year''s leaves. The northbound ruts have
    been broken through — a fresh track cut clean across the dried ridges by something narrower than a
    cart, and a great deal more recent than the mud that set around them.



    [Lyra] That''s it. North takes you to the mines in half a day, and it''s uphill the whole way so call
    it two-thirds. South takes you to a hot meal and people who''ll lie to you politely. Pick one. (watches
    the northern road a moment longer than the sentence needs, then deliberately turns her back on it)'
- role: user
  content: South. I want the meal and the answers.
- role: assistant
  content: 'Thornhaven announces itself in stages, the way villages do. Woodsmoke first, hanging in the
    trees a quarter of an hour before you see anything at all. Then the ring of a hammer on iron, unhurried
    — four strokes and a pause, four strokes and a pause. Then a break in the trees and the roofs below
    you, timber and stone, low and set close together the way buildings sit when the people who raised
    them wanted to be able to shout to one another.

    The road becomes a street without ever quite deciding to. There is a market square you could cross
    in twenty paces, a well with a slate roof over it, and a smithy standing open-fronted with its fire
    banked.

    Two women loading a handcart stop loading the handcart. They do not look away and they do not look
    at each other, which somehow makes it worse. Further along, a boy of about nine is sent off at a run
    by a woman who does not take her eyes off you while she sends him, and he goes between two houses
    and is gone.

    Nobody says anything at all. The hammer has stopped.

    '
- role: user
  content: I walk into the square slowly, hands where they can see them.
- role: assistant
  content: 'It works, more or less. The women go back to the handcart, though one of them keeps you in
    the edge of her vision the entire time and adjusts a strap that does not need adjusting twice. The
    hammer starts again after a moment, and the smith does not look up, and you notice that he has arranged
    himself so that the anvil is between his body and the square.

    The well has a slate roof and a bucket on a chain worn bright at the last two feet. Above a door on
    the far side hangs a painted board — a tankard picked out in gold leaf that has mostly flaked away,
    leaving a shape you would still recognise as a tankard from further off than the leaf ever managed.

    The boy who was sent running comes back, and stands in a doorway, and stares at you with the flat
    unembarrassed attention of the very young, until an arm comes out of the dark behind him and pulls
    him inside by the collar.

    Beside you, Lyra has slowed to your pace without being asked, which is the first unnecessary thing
    she has done all morning.

    '
- role: user
  content: I head for the tavern with the gold tankard sign.
- role: assistant
  content: 'The common room is dim after the square, and for a few seconds you can see nothing but the
    shape of the windows. It smells of ash, wet wool, and barley going over in a pot somewhere behind.
    Six tables. Four of them empty. Two old men at the fifth stop talking the instant the door opens and
    do not start again, and the silence they leave behind is not an accident but a decision, taken jointly,
    without either of them looking at the other.

    The floor is swept. The rushes are fresh. Somebody keeps this place with more care than the trade
    seems likely to repay.

    Behind the counter, a broad woman in her fifties is drying a jug with a cloth. She takes you in from
    boots to hairline in the time it takes you to cross half the room, and by the time you reach the counter
    she has already decided several things about you and set the jug down in a way that suggests she is
    prepared to revise one of them if you give her a reason.

    '
- role: user
  content: Good morning. I'd like a meal, if you serve strangers.
- role: assistant
  content: 'The jug goes down on the counter with a small sound that is not quite a thump. Behind you
    one of the old men shifts on the bench and the wood complains about it, and neither of them leaves,
    which you suspect is its own kind of statement.

    She looks at your hands rather than your face while she answers — at the sword you have not put down
    and at the knuckles, which are unmarked.



    [Marta] I serve anyone with coin, and anyone without it once. Sit down, you''re making the room nervous.
    You came in off the north road with Lyra, which means you''re either lost or trouble, and I''ll know
    which of the two before that bowl''s empty. (sets out a wooden bowl and a heel of dark bread without
    waiting for an answer, and fills the bowl generously)'
- role: user
  content: I woke at the shrine with no memory. Has anything like that happened here before?
- role: assistant
  content: 'The two old men get up together, which is not a coincidence, collect their cups, and take
    them out through the door into the square. Marta watches them the whole way. She watches the door
    for a moment after it has shut, too.

    When she turns back, the cloth has found something on the counter that needs working at. There is
    nothing on the counter. She works at it anyway, and the scrubbing gives her somewhere to put her eyes.



    [Marta] It''s happened. Twice in my time here, and I''ve been here twenty-two years. One of them paid
    for a room with a coin no smith in this valley ever struck — wrong weight, wrong metal, and a face
    on it I''d not seen before or since. And that''s the whole of what I''ll say about it, so don''t set
    yourself to asking round it. (scrubs at a mark on the counter that is not there, and does not look
    up again until the subject has changed)'
- role: user
  content: I let it go and eat. I ask about a room instead.
- role: assistant
  content: 'The barley is thick enough to stand a spoon in and there is considerably more meat in it than
    she charged for, which she does not mention and you do not mention either. It is the first food you
    can remember eating, in the most literal possible sense, and you have to stop halfway through and
    put the spoon down for a moment.

    The change in her is small and entirely real: she stops finding work for the cloth. She folds it instead,
    once, and puts it over the tap handle, and leans on the counter with both forearms in the manner of
    a woman who has decided to be off duty for the length of a conversation.

    She names a price for the back room low enough that it is plainly a test of whether you will try to
    haggle it lower.



    [Marta] Back room, second on the left, and the shutter sticks so don''t force it or you''ll have it
    off the hinge and me after you about it. You can settle when you know whether you''re staying, and
    don''t tell me you know yet, because you don''t. (puts an iron key on the counter and pushes it across
    with two fingers, then goes back to the pot)'
- role: user
  content: I listen to what the room is saying.
- role: assistant
  content: 'Three men come in for the middle of the day and the room fills enough to talk under, which
    is the point at which a village stops watching a stranger and starts forgetting about him. You keep
    your head down over the bowl.

    It is all the mines. Somebody''s boards came off in the night up there. Somebody''s dog will not go
    past the second bend on the north road and has to be carried, which the man telling it clearly finds
    humiliating and is telling anyway. A woman at the end table says her brother-in-law saw a light up
    on the spoil heap three nights back, and everyone at her table tells her at once, over the top of
    each other, that he did not.

    That last part is the piece that stays with you. Not the light. The speed of the correction, and how
    many of them joined in, and the fact that not one of them asked her what colour it was.

    '
- role: user
  content: I go back out to the square and find whoever speaks for this village.
- role: assistant
  content: 'He is at the well, and he has been at the well for some time, and he does not trouble to pretend
    that he arrived there for water. Old, upright, grey to the collar, with big hands gone knotted at
    the joints and the particular stillness of a man who has been given bad news before and has arranged
    himself to receive it again without falling over.

    He lets you get all the way across the square. He lets you get close enough to speak and then does
    not let you speak.



    [Aldric] Aldric. I keep the council, for what that''s worth in a place this size. You''ll be the one
    from the shrine. Before you ask me for anything at all — my son Corwin went up to the mines two winters
    ago and did not come back, and I have had four strangers through here since, and not one of those
    came back either. So you''ll understand if I''d rather you ate your meal and went south. (does not
    offer a hand, and does not stop working the well rope while he says any of it)'
- role: user
  content: Did anyone go in after him?
- role: assistant
  content: 'The bucket comes up. He sets it on the rim of the well and does not pour it, and for a moment
    the only sound in the square is water going back down into the shaft drop by drop off the bottom of
    the pail, each one taking a very long time to arrive.

    He has gone the particular kind of still that is not calm. You have asked the question that the whole
    arrangement at the well was built to be asked at, and now that it has been asked he does not want
    it after all.



    [Aldric] That''s council business and it stays council business. Ask me about the road. Ask me about
    the boards, ask me for a lamp and oil and I''ll see you get both. Don''t ask me that again. (lifts
    the bucket and walks away with it while you are still standing there, and the water slops over his
    boot and he does not break stride)'
- role: user
  content: Lyra. Four people woke at that shrine. You counted them like you'd been keeping the number
    a long time.
- role: assistant
  content: 'She has been sitting on the mounting block by the smithy for the better part of an hour doing
    nothing whatsoever, which you now understand she was doing on purpose, and within sight of the well,
    which you understand as well.

    She does not pretend not to know what you mean. She looks at the north road over the roofs while she
    decides — you can see the exact moment the decision goes one way rather than the other — and then
    she stops looking at it, which is how you know.



    [Lyra] Five. I woke there myself, three years back, on the same stone, with a bow across my knees
    I didn''t remember buying and no more idea of my own name than you''ve got of yours. That''s why I
    range that clearing and nobody else will. Now you know why I don''t talk about the fourth. (says it
    flatly, once, all the way through, and does not offer to repeat any of it)'
- role: user
  content: Then you know what I'm going to do. I'm going up the north road.
- role: assistant
  content: 'She is already standing, which means she worked out what you were going to do somewhere around
    the middle of the sentence and possibly a good deal earlier than that.

    The afternoon has turned over while you were talking. The light on the roofs has gone from white to
    something close to the colour of the tankard on the sign, and over the ridge to the north — where
    the mines are, where the road goes — weather is stacking up grey and taking its time about it. Down
    the street, Marta has come out onto her own doorstep to look at the sky, and is looking at the two
    of you instead.



    [Lyra] I know. I''ll take you as far as the second bend and not one pace past it — that''s my limit,
    it isn''t up for discussion, and if you argue I''ll leave you at the first. Bring the lantern. Get
    oil off Marta, she''ll not sell it to you but she''ll give it. (checks her bowstring with her thumb,
    twice, which is once more than the string needs)'
- role: user
  content: We go. North road, before the light turns.
- role: assistant
  content: 'Thornhaven lets you leave a great deal more easily than it let you arrive. Nobody stops working
    this time. Nobody watches you the whole way to the trees, except Marta, who watches you the whole
    way to the trees.

    The road climbs almost at once and then keeps climbing, in that steady ungenerous way that never gets
    steep enough to justify stopping. Within half an hour the beeches thin and the hedgerows give out
    and there is nothing on either side but bracken going brown at the tips and, further up, loose shale.

    The ruts you looked at this morning are under your boots again. They read differently now that you
    know what made the fresh break in them — narrow, regular, and running north, and nothing at all running
    back south.

    Behind and below, the smoke from the village does not rise. It flattens out along the valley floor
    and lies there, which Lyra glances back at twice without saying anything about it.

    '
- role: user
  content: What's at the second bend that makes it your limit?
- role: assistant
  content: 'The last of the trees give out. The road runs on between banks of grey shale that have been
    holding the day''s heat and are giving it back at you now from both sides, so that the air over the
    road shimmers slightly and smells of hot dust and nothing else.

    She takes a long time over it. Long enough that you stop expecting an answer and start composing the
    next question, which is of course when it comes.



    [Lyra] Nothing''s at the second bend. That''s the whole point of it. Past that the birds stop, and
    they don''t start again, and they don''t start again on the way back down either — which is the part
    that matters, because whatever it is doesn''t move on. I decided a while ago that a place with no
    birds in it gets to keep me out. (does not slow down while she says it, and does not look at you)'
- role: user
  content: I keep walking and I listen.
- role: assistant
  content: 'The first bend is a long slow curve around a shoulder of rock and nothing changes across it
    at all, which is somehow worse than if something had.

    The second is tighter, cut into the hillside with a low wall of stacked shale on the outside of it,
    and you feel the change before you have finished walking through it: the sound of your own boots starts
    coming back at you off the cutting a fraction late.

    And then the sound of your own boots is all there is. No pigeon. No crow working the scree, and there
    is scree here, and there should be crows on it. No small movement in the bracken at the roadside that
    stops when you look at it. The wind is still moving in the shale grass — you can see it moving, a
    long grey ripple going up the slope — so it is not the wind that has stopped.

    Behind you Lyra has not said anything for some minutes. When you glance back she is walking with her
    head slightly turned, listening to the same absence you are.

    '
- role: user
  content: How far now?
- role: assistant
  content: 'She has stopped walking. She is standing in the road four paces back the way you came, at
    the bend itself, with her weight even on both feet for the first time all day, and she is not pretending
    it is anything other than exactly what it is.

    Ahead, where the cutting opens out, the ground levels into a wide shelf of grey spoil, picked over
    and gone to weed at the edges. The mine mouth sits at the back of it: a black rectangle framed in
    old squared timber, set into the hillside without ceremony, the way a working thing is built by people
    who were never going to have to look at it for pleasure.

    The boards that closed it have been pulled off. You can see that from here. What you can also see
    from here, and what makes you slow down, is that they have not been broken through and left where
    they fell. They have been taken down, and squared up, and stacked.



    [Lyra] Two hundred paces. This is my bend, and I meant it. I''ll hold here until full dark — you''ve
    that long. After full dark I''m going back down, with you or without you, and I''ll not think badly
    of myself for it. (sets her feet, unshoulders the bow, and does not come one step further)'
- role: user
  content: I walk up to the entrance and look at the stack of boards without touching them.
- role: assistant
  content: 'Nine of them. Squared off, ends flush, laid against the timber frame in the way a careful
    person stacks lumber they fully intend to use again. The bottom board is resting on two off-cuts to
    keep it out of the wet.

    The nails have been drawn, not snapped. You crouch to be sure of it and you are sure of it — the shanks
    are straight, none of them sheared, none of them bent past use. They are in a small pile on the flat
    of the lowest board, and they have been laid points all one way.

    Cold air comes out of the opening at your ankles, moving steadily, the way air moves in a shaft that
    goes somewhere. It smells of wet stone and, underneath that, of nothing at all — not damp, not rot,
    not the ammoniac reek of anything living down there in two winters. Just cold, and stone, and an absence
    with a draught behind it.

    Behind you, four hundred paces of empty road away, Lyra has not moved from the bend. The light on
    the spoil heap has gone the colour of an old bruise, and it is going faster now than it was.

    '
