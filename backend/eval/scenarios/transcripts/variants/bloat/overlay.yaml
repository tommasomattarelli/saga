# bloat — isolates CONTEXT LENGTH.
#
# Hypothesis under test: compliance degrades because the obligations sit at the
# top of a prompt that has grown large, and compete with everything below them.
#
# This variant changes NO turns. Same 25 events, same prose, same world state —
# only how much of it reaches the prompt. That is deliberate: an overlay that
# rewrote the turns verbosely would change content and length together, and a
# result could not be attributed to either.
#
# What it does NOT isolate, stated plainly: raising the active window also
# shifts the compression ratio (more raw turns, fewer summarised ones), so this
# measures "more tokens of the same story" rather than pure token count. A truly
# pure length knob would need semantically inert padding, which does not occur in
# production and would measure a condition that never happens.

name: bloat
base: gold
kind: build-override

description: >
  The gold transcript rendered with a wider active window, keeping more raw turns
  in the prompt history.

build:
  active_window_turns: 20

replace: []
