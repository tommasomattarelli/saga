# Turns 21-25 — the north road and the broken boards. Ends unresolved, on purpose:
# the last turn is where a probe picks up, so it must leave real tension and a
# present NPC with something to say.

- n: 21
  player: "We go. North road, before the light turns."
  dm: >
    Thornhaven lets you leave a great deal more easily than it let you arrive.
    Nobody stops working this time. Nobody watches you the whole way to the trees,
    except Marta, who watches you the whole way to the trees.

    The road climbs almost at once and then keeps climbing, in that steady
    ungenerous way that never gets steep enough to justify stopping. Within half an
    hour the beeches thin and the hedgerows give out and there is nothing on either
    side but bracken going brown at the tips and, further up, loose shale.

    The ruts you looked at this morning are under your boots again. They read
    differently now that you know what made the fresh break in them — narrow,
    regular, and running north, and nothing at all running back south.

    Behind and below, the smoke from the village does not rise. It flattens out
    along the valley floor and lies there, which Lyra glances back at twice without
    saying anything about it.
  minutes: 50
  updates:
    - {key: event_log_entry, target: "Left Thornhaven northward with Lyra in the late afternoon. The fresh tracks in the road run north only."}
  # In transit along the north-road EDGE — position stays at Thornhaven until
  # arrival at old-mines on t24. See the note on t6.
  world_patch: {}

- n: 22
  player: "What's at the second bend that makes it your limit?"
  dm: >
    The last of the trees give out. The road runs on between banks of grey shale
    that have been holding the day's heat and are giving it back at you now from
    both sides, so that the air over the road shimmers slightly and smells of hot
    dust and nothing else.

    She takes a long time over it. Long enough that you stop expecting an answer and
    start composing the next question, which is of course when it comes.
  npc:
    name: Lyra
    dialogue: "Nothing's at the second bend. That's the whole point of it. Past that the birds stop, and they don't start again, and they don't start again on the way back down either — which is the part that matters, because whatever it is doesn't move on. I decided a while ago that a place with no birds in it gets to keep me out."
    action: "does not slow down while she says it, and does not look at you"
  minutes: 35
  updates:
    - {key: npc_psychology, target: Lyra, changes: {trust: 4, fear: 3}}
    - {key: event_log_entry, target: "Past the second bend of the north road the birds go silent, and stay silent on the way back down. Lyra treats that as her boundary."}
  world_patch: {}

- n: 23
  player: "I keep walking and I listen."
  dm: >
    The first bend is a long slow curve around a shoulder of rock and nothing changes
    across it at all, which is somehow worse than if something had.

    The second is tighter, cut into the hillside with a low wall of stacked shale on
    the outside of it, and you feel the change before you have finished walking
    through it: the sound of your own boots starts coming back at you off the cutting
    a fraction late.

    And then the sound of your own boots is all there is. No pigeon. No crow working
    the scree, and there is scree here, and there should be crows on it. No small
    movement in the bracken at the roadside that stops when you look at it. The wind
    is still moving in the shale grass — you can see it moving, a long grey ripple
    going up the slope — so it is not the wind that has stopped.

    Behind you Lyra has not said anything for some minutes. When you glance back she
    is walking with her head slightly turned, listening to the same absence you are.
  minutes: 30
  updates:
    - {key: event_log_entry, target: "Passed the second bend. The birds stopped exactly where Lyra said they would, though the wind did not."}
  # The silence belongs to the approach, but node_status keys nodes, not edges —
  # an edge condition would be an edge_override (ADR 0008). Carried on the
  # destination node instead, on t24.
  world_patch: {}

- n: 24
  player: "How far now?"
  dm: >
    She has stopped walking. She is standing in the road four paces back the way you
    came, at the bend itself, with her weight even on both feet for the first time
    all day, and she is not pretending it is anything other than exactly what it is.

    Ahead, where the cutting opens out, the ground levels into a wide shelf of grey
    spoil, picked over and gone to weed at the edges. The mine mouth sits at the back
    of it: a black rectangle framed in old squared timber, set into the hillside
    without ceremony, the way a working thing is built by people who were never going
    to have to look at it for pleasure.

    The boards that closed it have been pulled off. You can see that from here. What
    you can also see from here, and what makes you slow down, is that they have not
    been broken through and left where they fell. They have been taken down, and
    squared up, and stacked.
  npc:
    name: Lyra
    dialogue: "Two hundred paces. This is my bend, and I meant it. I'll hold here until full dark — you've that long. After full dark I'm going back down, with you or without you, and I'll not think badly of myself for it."
    action: "sets her feet, unshoulders the bow, and does not come one step further"
  minutes: 20
  updates:
    - {key: npc_psychology, target: Lyra, changes: {trust: 5, fear: 5}}
    - {key: event_log_entry, target: "Reached the mine mouth. The boards were levered off from within and stacked, not broken in from outside."}
  world_patch:
    player_position: old-mines
    npc_location: {Lyra: old-mines}
    node_status:
      old-mines: "entrance open, boards levered off from within and stacked; birds silent on the approach past the second bend"

- n: 25
  player: "I walk up to the entrance and look at the stack of boards without touching them."
  dm: >
    Nine of them. Squared off, ends flush, laid against the timber frame in the way a
    careful person stacks lumber they fully intend to use again. The bottom board is
    resting on two off-cuts to keep it out of the wet.

    The nails have been drawn, not snapped. You crouch to be sure of it and you are
    sure of it — the shanks are straight, none of them sheared, none of them bent
    past use. They are in a small pile on the flat of the lowest board, and they have
    been laid points all one way.

    Cold air comes out of the opening at your ankles, moving steadily, the way air
    moves in a shaft that goes somewhere. It smells of wet stone and, underneath
    that, of nothing at all — not damp, not rot, not the ammoniac reek of anything
    living down there in two winters. Just cold, and stone, and an absence with a
    draught behind it.

    Behind you, four hundred paces of empty road away, Lyra has not moved from the
    bend. The light on the spoil heap has gone the colour of an old bruise, and it is
    going faster now than it was.
  minutes: 6
  updates:
    - {key: event_log_entry, target: "The boards were removed with care, the nails drawn and stacked points-one-way. Whoever opened the mines meant to close them again."}
  world_patch: {}
