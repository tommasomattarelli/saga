# Turns 11-20 — Thornhaven. Marta, Aldric, and Lyra's own waking.

- n: 11
  player: "I walk into the square slowly, hands where they can see them."
  dm: >
    It works, more or less. The women go back to the handcart, though one of them
    keeps you in the edge of her vision the entire time and adjusts a strap that does
    not need adjusting twice. The hammer starts again after a moment, and the smith
    does not look up, and you notice that he has arranged himself so that the anvil
    is between his body and the square.

    The well has a slate roof and a bucket on a chain worn bright at the last two
    feet. Above a door on the far side hangs a painted board — a tankard picked out
    in gold leaf that has mostly flaked away, leaving a shape you would still
    recognise as a tankard from further off than the leaf ever managed.

    The boy who was sent running comes back, and stands in a doorway, and stares at
    you with the flat unembarrassed attention of the very young, until an arm comes
    out of the dark behind him and pulls him inside by the collar.

    Beside you, Lyra has slowed to your pace without being asked, which is the first
    unnecessary thing she has done all morning.
  minutes: 6
  updates:
    - {key: event_log_entry, target: "Entered Thornhaven openly with hands visible. The village stayed wary but did not turn hostile."}
  world_patch: {}

- n: 12
  player: "I head for the tavern with the gold tankard sign."
  dm: >
    The common room is dim after the square, and for a few seconds you can see
    nothing but the shape of the windows. It smells of ash, wet wool, and barley
    going over in a pot somewhere behind. Six tables. Four of them empty. Two old men
    at the fifth stop talking the instant the door opens and do not start again,
    and the silence they leave behind is not an accident but a decision, taken
    jointly, without either of them looking at the other.

    The floor is swept. The rushes are fresh. Somebody keeps this place with more
    care than the trade seems likely to repay.

    Behind the counter, a broad woman in her fifties is drying a jug with a cloth.
    She takes you in from boots to hairline in the time it takes you to cross half
    the room, and by the time you reach the counter she has already decided several
    things about you and set the jug down in a way that suggests she is prepared to
    revise one of them if you give her a reason.
  minutes: 5
  updates: []
  world_patch:
    player_position: common-room
    npc_location: {Marta: common-room}

- n: 13
  player: "Good morning. I'd like a meal, if you serve strangers."
  dm: >
    The jug goes down on the counter with a small sound that is not quite a thump.
    Behind you one of the old men shifts on the bench and the wood complains about
    it, and neither of them leaves, which you suspect is its own kind of statement.

    She looks at your hands rather than your face while she answers — at the sword
    you have not put down and at the knuckles, which are unmarked.
  npc:
    name: Marta
    dialogue: "I serve anyone with coin, and anyone without it once. Sit down, you're making the room nervous. You came in off the north road with Lyra, which means you're either lost or trouble, and I'll know which of the two before that bowl's empty."
    action: "sets out a wooden bowl and a heel of dark bread without waiting for an answer, and fills the bowl generously"
  minutes: 4
  updates:
    - {key: npc_psychology, target: Marta, changes: {trust: 6, respect: 5}, first_meeting: true}
    - {key: event_log_entry, target: "Met Marta, keeper of the Gilded Tankard. She feeds first and judges after."}
  world_patch: {}

- n: 14
  player: "I woke at the shrine with no memory. Has anything like that happened here before?"
  dm: >
    The two old men get up together, which is not a coincidence, collect their cups,
    and take them out through the door into the square. Marta watches them the whole
    way. She watches the door for a moment after it has shut, too.

    When she turns back, the cloth has found something on the counter that needs
    working at. There is nothing on the counter. She works at it anyway, and the
    scrubbing gives her somewhere to put her eyes.
  npc:
    name: Marta
    dialogue: "It's happened. Twice in my time here, and I've been here twenty-two years. One of them paid for a room with a coin no smith in this valley ever struck — wrong weight, wrong metal, and a face on it I'd not seen before or since. And that's the whole of what I'll say about it, so don't set yourself to asking round it."
    action: "scrubs at a mark on the counter that is not there, and does not look up again until the subject has changed"
  minutes: 8
  updates:
    - {key: npc_psychology, target: Marta, changes: {trust: 3, fear: 4}}
    - {key: event_log_entry, target: "Marta admits two others woke at the shrine in her twenty-two years. One paid with a coin no local smith struck. She refused to name the smith or say more."}
  world_patch: {}

- n: 15
  player: "I let it go and eat. I ask about a room instead."
  dm: >
    The barley is thick enough to stand a spoon in and there is considerably more
    meat in it than she charged for, which she does not mention and you do not
    mention either. It is the first food you can remember eating, in the most
    literal possible sense, and you have to stop halfway through and put the spoon
    down for a moment.

    The change in her is small and entirely real: she stops finding work for the
    cloth. She folds it instead, once, and puts it over the tap handle, and leans on
    the counter with both forearms in the manner of a woman who has decided to be off
    duty for the length of a conversation.

    She names a price for the back room low enough that it is plainly a test of
    whether you will try to haggle it lower.
  npc:
    name: Marta
    dialogue: "Back room, second on the left, and the shutter sticks so don't force it or you'll have it off the hinge and me after you about it. You can settle when you know whether you're staying, and don't tell me you know yet, because you don't."
    action: "puts an iron key on the counter and pushes it across with two fingers, then goes back to the pot"
  minutes: 25
  updates:
    - {key: npc_psychology, target: Marta, changes: {trust: 8, respect: 4}}
    - {key: inventory_change, target: "Iron room key", change: add, description: "Back room of the Gilded Tankard. The shutter sticks."}
  world_patch: {}

- n: 16
  player: "I listen to what the room is saying."
  dm: >
    Three men come in for the middle of the day and the room fills enough to talk
    under, which is the point at which a village stops watching a stranger and starts
    forgetting about him. You keep your head down over the bowl.

    It is all the mines. Somebody's boards came off in the night up there. Somebody's
    dog will not go past the second bend on the north road and has to be carried,
    which the man telling it clearly finds humiliating and is telling anyway. A woman
    at the end table says her brother-in-law saw a light up on the spoil heap three
    nights back, and everyone at her table tells her at once, over the top of each
    other, that he did not.

    That last part is the piece that stays with you. Not the light. The speed of the
    correction, and how many of them joined in, and the fact that not one of them
    asked her what colour it was.
  minutes: 40
  updates:
    - {key: event_log_entry, target: "Village talk: boards came off the old mines in the night, dogs refuse the second bend of the north road, and a sighting of a light on the spoil heap was shouted down immediately."}
  world_patch: {}

- n: 17
  player: "I go back out to the square and find whoever speaks for this village."
  dm: >
    He is at the well, and he has been at the well for some time, and he does not
    trouble to pretend that he arrived there for water. Old, upright, grey to the
    collar, with big hands gone knotted at the joints and the particular stillness of
    a man who has been given bad news before and has arranged himself to receive it
    again without falling over.

    He lets you get all the way across the square. He lets you get close enough to
    speak and then does not let you speak.
  npc:
    name: Aldric
    dialogue: "Aldric. I keep the council, for what that's worth in a place this size. You'll be the one from the shrine. Before you ask me for anything at all — my son Corwin went up to the mines two winters ago and did not come back, and I have had four strangers through here since, and not one of those came back either. So you'll understand if I'd rather you ate your meal and went south."
    action: "does not offer a hand, and does not stop working the well rope while he says any of it"
  minutes: 12
  updates:
    - {key: npc_psychology, target: Aldric, changes: {trust: 4, respect: 6}, first_meeting: true}
    - {key: quest_update, target: "The Lost Son", change: active, description: "Aldric's son Corwin went into the old mines two winters ago and never returned."}
    - {key: event_log_entry, target: "Aldric, the village elder, named his lost son: Corwin, gone into the mines two winters ago. Four strangers have gone the same way since."}
  world_patch: {}

- n: 18
  player: "Did anyone go in after him?"
  dm: >
    The bucket comes up. He sets it on the rim of the well and does not pour it, and
    for a moment the only sound in the square is water going back down into the shaft
    drop by drop off the bottom of the pail, each one taking a very long time to
    arrive.

    He has gone the particular kind of still that is not calm. You have asked the
    question that the whole arrangement at the well was built to be asked at, and
    now that it has been asked he does not want it after all.
  npc:
    name: Aldric
    dialogue: "That's council business and it stays council business. Ask me about the road. Ask me about the boards, ask me for a lamp and oil and I'll see you get both. Don't ask me that again."
    action: "lifts the bucket and walks away with it while you are still standing there, and the water slops over his boot and he does not break stride"
  minutes: 5
  updates:
    - {key: npc_psychology, target: Aldric, changes: {trust: -6, respect: 3, fear: 3}}
    - {key: event_log_entry, target: "Aldric refused to say whether a search party went in after Corwin. The refusal was itself an answer."}
  world_patch: {}

- n: 19
  player: "Lyra. Four people woke at that shrine. You counted them like you'd been keeping the number a long time."
  dm: >
    She has been sitting on the mounting block by the smithy for the better part of an
    hour doing nothing whatsoever, which you now understand she was doing on purpose,
    and within sight of the well, which you understand as well.

    She does not pretend not to know what you mean. She looks at the north road over
    the roofs while she decides — you can see the exact moment the decision goes one
    way rather than the other — and then she stops looking at it, which is how you
    know.
  npc:
    name: Lyra
    dialogue: "Five. I woke there myself, three years back, on the same stone, with a bow across my knees I didn't remember buying and no more idea of my own name than you've got of yours. That's why I range that clearing and nobody else will. Now you know why I don't talk about the fourth."
    action: "says it flatly, once, all the way through, and does not offer to repeat any of it"
  minutes: 10
  updates:
    - {key: npc_psychology, target: Lyra, changes: {trust: 10, respect: 5}}
    - {key: event_log_entry, target: "Lyra revealed she woke at the shrine herself three years ago with no memory. She is the fifth, not a witness."}
  world_patch: {}

- n: 20
  player: "Then you know what I'm going to do. I'm going up the north road."
  dm: >
    She is already standing, which means she worked out what you were going to do
    somewhere around the middle of the sentence and possibly a good deal earlier
    than that.

    The afternoon has turned over while you were talking. The light on the roofs has
    gone from white to something close to the colour of the tankard on the sign, and
    over the ridge to the north — where the mines are, where the road goes — weather
    is stacking up grey and taking its time about it. Down the street, Marta has come
    out onto her own doorstep to look at the sky, and is looking at the two of you
    instead.
  npc:
    name: Lyra
    dialogue: "I know. I'll take you as far as the second bend and not one pace past it — that's my limit, it isn't up for discussion, and if you argue I'll leave you at the first. Bring the lantern. Get oil off Marta, she'll not sell it to you but she'll give it."
    action: "checks her bowstring with her thumb, twice, which is once more than the string needs"
  minutes: 8
  updates:
    - {key: npc_psychology, target: Lyra, changes: {trust: 6}}
    - {key: inventory_change, target: "Flask of lamp oil", change: add, description: "From Marta, who would not take coin for it."}
    - {key: event_log_entry, target: "Decided to go north to the mines before dark. Lyra will come as far as the second bend and no further."}
  world_patch: {}
