[project]
name = "saga-backend"
version = "0.1.0"
description = "SAGA - AI-Driven Tabletop RPG Backend"
requires-python = ">=3.12"
license = "AGPL-3.0-or-later"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "pydantic[email]>=2.10.0",
    "pydantic-settings>=2.14.2",
    "python-jose[cryptography]>=3.3.0",
    "bcrypt>=4.2.0",
    "python-multipart>=0.0.12",
    "httpx>=0.28.0",
    "openai>=1.57.0",
    "anthropic>=0.39.0",
    "google-genai>=1.0.0",
    "pgvector>=0.3.6",
    "cryptography>=44.0.0",
    "python-dotenv>=1.0.1",
    "structlog>=24.4.0",
    "json-repair>=0.30.0",
    "langgraph>=1.0.10",
    "langgraph-checkpoint-postgres>=2.0.0",
    "psycopg[binary,pool]>=3.2.0",
    "langsmith>=0.7.30",
    "slowapi>=0.1.9",
    "networkx>=3.6.1",
]

[project.optional-dependencies]
dev = []

[tool.mypy]
python_version = "3.12"
files = ["app"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = "pgvector.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "networkx.*"
ignore_missing_imports = true

[tool.ruff]
target-version = "py312"
line-length = 99

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "SIM"]
ignore = ["B008", "E501", "SIM105"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.coverage.run]
omit = ["app/core/agent.py", "app/core/streaming.py"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# eval/ holds operator tools, never collected as tests (they cost real API
# calls); this only lets their pure logic be imported by a unit test.
pythonpath = ["eval"]
filterwarnings = [
    "ignore::DeprecationWarning:google.genai.*"
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "pytest-mock>=3.15.1",
    "httpx>=0.28.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "types-pyyaml>=6.0.12",
    "types-python-jose>=3.3.4",
    "vulture>=2.16",
]
