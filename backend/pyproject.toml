[project]
name = "saga-backend"
version = "0.1.0"
description = "SAGA - AI-Driven Tabletop RPG Backend"
requires-python = ">=3.12"
license = "AGPL-3.0-or-later"
dependencies = [
    "fastapi>=0.139.0",
    "uvicorn[standard]>=0.51.0",
    "sqlalchemy[asyncio]>=2.0.51",
    "asyncpg>=0.30.0",
    "alembic>=1.18.5",
    "pydantic[email]>=2.13.4",
    "pydantic-settings>=2.14.2",
    "python-jose[cryptography]>=3.5.0",
    "bcrypt>=4.2.0",
    "python-multipart>=0.0.32",
    "httpx>=0.28.0",
    "openai>=2.45.0",
    "anthropic>=0.116.0",
    "google-genai>=2.11.0",
    "pgvector>=0.5.0",
    "cryptography>=49.0.0",
    "python-dotenv>=1.0.1",
    "structlog>=26.1.0",
    "json-repair>=0.61.4",
    "langgraph>=1.2.9",
    "langgraph-checkpoint-postgres>=3.1.0",
    "psycopg[binary,pool]>=3.3.4",
    "langsmith>=0.10.3",
    "slowapi>=0.1.10",
    "networkx>=3.6.1",
]

[project.optional-dependencies]
dev = []

[tool.mypy]
python_version = "3.12"
files = ["app"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = "pgvector.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "networkx.*"
ignore_missing_imports = true

[tool.ruff]
target-version = "py312"
line-length = 99

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "SIM"]
ignore = ["B008", "E501", "SIM105"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.coverage.run]
omit = ["app/core/agent.py", "app/core/streaming.py"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = [
    "ignore::DeprecationWarning:google.genai.*"
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "pytest-mock>=3.15.1",
    "httpx>=0.28.0",
    "ruff>=0.15.21",
    "mypy>=2.3.0",
    "types-pyyaml>=6.0.12",
    "types-python-jose>=3.3.4",
    "vulture>=2.16",
]
