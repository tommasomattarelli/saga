# SAGA — AI Model Configuration
# 
# Default model assignments per call type and tier.
# Override any value via environment variables:
#   SAGA_MODEL_DM_LOW, SAGA_MODEL_DM_MEDIUM, SAGA_MODEL_DM_HIGH
#   SAGA_MODEL_COMPANION, SAGA_MODEL_NPC, SAGA_MODEL_WORLD_SIM
#   SAGA_MODEL_MEMORY, SAGA_MODEL_EMBEDDING
#
# When a provider deprecates a model, update the defaults here and cut a new release.
# At runtime, if a configured model returns a deprecation error the router treats it
# as a provider failure and falls back to the next tier down.

# ---------------------------------------------------------------------------
# DM Narration — three-tier routing based on scene importance (0-10)
# ---------------------------------------------------------------------------
dm_narration:
  low:                       # importance 0-3: routine exploration / simple responses
    provider: google
    model: gemini-3-flash-preview
    temperature: 0.8
    max_tokens: 2000
  medium:                    # importance 4-6: normal gameplay
    provider: google
    model: gemini-3-flash-preview
    temperature: 0.8
    max_tokens: 3000
  high:                      # importance 7-10: boss fights, dramatic reveals
    provider: google
    model: gemini-3-flash-preview
    temperature: 0.9
    max_tokens: 4000

# ---------------------------------------------------------------------------
# Companion Dialogue — single tier, high-quality conversational model
# ---------------------------------------------------------------------------
companion_dialogue:
  default:
    provider: google
    model: gemini-3-flash-preview
    temperature: 0.7
    max_tokens: 1500

# ---------------------------------------------------------------------------
# NPC Behavior — budget model, high volume
# ---------------------------------------------------------------------------
npc_behavior:
  default:
    provider: google
    model: gemini-3-flash-preview
    temperature: 0.7
    max_tokens: 1000

# ---------------------------------------------------------------------------
# World Simulation — deterministic scoring, lower temperature
# ---------------------------------------------------------------------------
world_sim:
  default:
    provider: google
    model: gemini-3-flash-preview
    temperature: 0.5
    max_tokens: 1500

# ---------------------------------------------------------------------------
# Memory Compression — very focused summarization task
# ---------------------------------------------------------------------------
memory_compression:
  default:
    provider: google
    model: gemini-3-flash-preview
    temperature: 0.3
    max_tokens: 500

# ---------------------------------------------------------------------------
# Embeddings — skipped when no API key is configured
# ---------------------------------------------------------------------------
embedding:
  default:
    provider: google
    model: gemini-3-flash-preview
    dimensions: 1536

# ---------------------------------------------------------------------------
# Gameplay Settings — runtime behavior configuration
# Override via env: SAGA_GAMEPLAY_CONTEXT_WINDOW_TURNS, etc.
# ---------------------------------------------------------------------------
gameplay:
  context_window_turns: 8          # how many recent turns to include verbatim in the DM prompt
  npc_verbosity: "medium"          # controls max parallel NPC Actor-Director calls per turn
                                   #   null=0  minimal=1  low=2  medium=3  high=5  unlimited=999
  compression_enabled: true        # compress old turns beyond the active window via budget LLM
  fact_extraction_enabled: true    # extract atomic facts from each turn in the background
