instructions: |
  Extract self-contained historical facts useful for future recall, supported by this batch,
  not a turn-by-turn action log. Prioritize lasting consequences, commitments, relationship
  changes, unresolved clues, warnings and meaningful constraints. Retain small supported details
  that distinguish these or provide a useful recall hook, even when larger events dominate
  the summary. Prefer outcomes over individual combat moves or incidental microactions.
  The configured allowance is a maximum, not a target. When candidates exceed it, select
  the most useful supported memories rather than the most vivid or most recent actions.
  No minimum is required: facts may be empty. Do not fill the allowance with decorative
  microactions, repeated dialogue, or restatements of the same fact.
  Each fact must be independently understandable without the summary: identify the relevant
  people, place or object and preserve necessary attribution. Keep one retrievable claim or
  tightly connected consequence per fact. Do not bundle unrelated claims to fit the allowance.
  Do not merge an occurrence with a statement, belief or intention to save allowance; keep the
  claim's concrete anchor inside the claim's own fact.
  Speaker boundaries: `player_action` is the player's own words and claims. `narration` may
  contain speaker-labelled lines such as `Lyra: "..."`, and `invoke_npc` identifies the NPC
  who spoke them. A declarative fact (statement, belief, intention) reports exactly one
  speaker's claim: never place another speaker's claim in the same content, not even as a
  preface, context or summary. Attribution points to the entity who made the claim the fact
  reports, never to another entity mentioned in the content. When the player states a claim
  and an NPC responds, commits or disagrees, emit one fact per speaker. A fact may name the
  original source of a reported claim as an entity, but the attribution is the reporter.
  Necessary overlap with the summary is allowed; do not omit a useful fact merely because
  the summary also mentions it. Do not invent future significance or resolve an unknown clue.
  Categories: event describes a meaningful happening; information a clue or disclosure;
  commitment a promise or agreement; relationship a consequential interpersonal change;
  state_change a durable change to a person, object, place or quest.
  assertion_type occurrence means an event actually occurred; statement reports what
  someone said; belief records an explicitly expressed belief; intention a stated plan.
  A claim is not proof of its content, and a promise is not its fulfilment.
  Describe events historically, not as assertions about current possession or state.
  Include relevant entities with name, type and descriptive role. Attribution contains
  zero-based indices of the entities making a statement, expressing a belief or intention;
  it must be nonempty for those assertions and empty for occurrences. Indices are local to
  each fact's entities array: recompute them for every fact and never reuse an index
  assigned to an entity in another fact.
  source_turns lists the supplied local turn references that actually support the fact.
  Preserve explicit temporal expressions and deadlines as text, without inventing dates.
  Use only the configured importance levels and justify each from evidence; ordinary
  importance never makes an insignificant decorative action worth extracting. Reserve
  critical for a supported campaign-defining fact: a revelation that redefines a central
  unresolved mystery, even before any decision or action follows, or the resolution of a
  defining obligation or threat, including a binding promise fulfilled with lasting
  consequences and the durable relationship change caused by that resolution. For example,
  a supported revelation about the central key's true location is critical before recovery;
  returning that key after a delayed promise, completing its defining quest and changing
  trust because of that resolution are critical together. A useful clue or a first meeting
  is ordinary.
  Set `type` from what the entity is, not from its narrative role. Places use `location`,
  documents and keys use `item`, the player uses `player`, named NPCs use `npc` and quests
  use `quest`; never label a place or document as `player`. For example, an "old landing"
  described as the place where marks narrow the search is `location`, not `player`.
  Never copy raw tool argument names, fixture tokens such as `__unknown_fixture_location__`,
  internal state keys such as `met_player`, or dice internals into `content`; translate them
  into story-level language, such as "a place absent from the map" or "Lyra met the player
  but gave no answer". Preserve source chronology when a batch supports several turns.
  Do not generate IDs, canonical references, world entities, or links to earlier facts.
example: |
  This example illustrates structure only; classify current-batch facts using the actual criteria,
  not the example's importance label or rank.
example_output: |
  {"facts":[{"content":"The player told Neris that Morrowglass the ferryman swore the sealed charter lay under the third stair, wrapped in green wax.","category":"information","assertion_type":"statement","entities":[{"name":"the player","type":"player","role":"speaker reporting the claim"},{"name":"Morrowglass","type":"npc","role":"original source named in the report"},{"name":"Neris","type":"npc","role":"listener"}],"attribution":[0],"source_turns":["t1"],"temporal_references":[],"importance":{"level":"example-level","reason":"A reported clue with a named listener."}},{"content":"Neris promised to return the bronze key by dusk.","category":"commitment","assertion_type":"intention","entities":[{"name":"the player","type":"player","role":"listener"},{"name":"Neris","type":"npc","role":"speaker making the promise"}],"attribution":[1],"source_turns":["t1"],"temporal_references":["by dusk"],"importance":{"level":"example-level","reason":"A promise with an explicit deadline."}},{"content":"Mira said she believed the open arch could be crossed safely, while noting she had not tested it.","category":"information","assertion_type":"belief","entities":[{"name":"Mira","type":"npc","role":"speaker expressing a belief"}],"attribution":[0],"source_turns":["t1"],"temporal_references":[],"importance":{"level":"example-level","reason":"An explicitly attributed belief, not a verified fact."}},{"content":"Neris tried the bronze key in the sealed door, but it did not turn.","category":"event","assertion_type":"occurrence","entities":[{"name":"Neris","type":"npc","role":"person attempting the key"},{"name":"bronze key","type":"item","role":"key used in the attempt"}],"attribution":[],"source_turns":["t2"],"temporal_references":[],"importance":{"level":"example-level","reason":"A meaningful failed attempt occurred; it does not establish a changed state."}}]}
