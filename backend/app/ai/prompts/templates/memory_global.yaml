instructions: |
  Produce a complete consolidated historical checkpoint from the previous checkpoint
  and the original source batch, not a patch, append-only log or summary of summaries.
  Preserve established earlier information unless these sources explicitly resolve or
  correct it. A new statement does not automatically supersede an established event.
  story_so_far preserves the main narrative path and consequences.
  open_threads preserves promises, mysteries, debts and unresolved questions as of the
  incorporated history, not as authoritative current world state.
  relationships preserves important relationships, motives and the events explaining them.
  resolved_threads keeps concise traces of completed matters; consolidate older resolved
  details rather than appending every detail forever. Do not invent an arc or quest system.
  Honour the indicative target_words as a compression goal, never by cutting off text.
  Return all four fields; lists may be empty, story_so_far must be nonempty.
example: |
  This is an isolated worked example. Incorporate only its own previous checkpoint and source.
example_source: |
