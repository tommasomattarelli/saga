# saga.config.yaml — Game-tunable configuration
#
# Edit this file to change models, gameplay behavior, feature toggles, and tool groups.
# Secrets and infra settings stay in .env / backend/app/config.py (12-factor).
#
# Provider configuration is per user (ADR 0018): each user picks one provider and one
# model in their settings and enters their own API keys (BYOAK). The blocks below are
# the instance policy and the defaults a user inherits before configuring their own.

# ---------------------------------------------------------------------------
# Generation — one model for every AI call (ADR 0018 A1/A2)
#
# There are no cost tiers and no per-call-type overrides: one model serves the DM,
# NPCs, compression and every background job. `default` is the instance fallback;
# `max_output_tokens` is a single runaway guardrail (std 14), not a per-call knob.
# ---------------------------------------------------------------------------
generation:
  default:
    provider: google
    model: gemini-3.5-flash
  max_output_tokens: 60000

# ---------------------------------------------------------------------------
# Providers — instance policy (ADR 0018 A3/A4/A5/A7)
#
# `allowed` is the single allowlist for generation and embeddings (all = every
# supported provider). `server_key_fallback` is the operator half of the double
# consent: a server key pays for a user call only when the operator enables it
# here AND the user consents in settings, and only if the user has no key of
# their own. `local_endpoints` names the only local endpoints the backend may
# contact; users select from this list and never supply URLs (SSRF containment).
# ---------------------------------------------------------------------------
providers:
  allowed: [openai, openrouter, google, local]
  server_key_fallback:
    openai: false
    openrouter: false
    google: false
  local_endpoints:
    ollama:
      base_url: http://localhost:11434/v1

# ---------------------------------------------------------------------------
# Embeddings (ADR 0018 B)
#
# The embedding profile is independent of generation (B1): each user picks
# provider + model in settings; `default` is the instance fallback. The
# instance default runs on OpenRouter with the OpenRouter key ONLY (owner
# decision 2026-10-19); Google stays supported.
#
# Vectors keep native model dimensions — no `dimensions` reduction knob; the
# dimension is observed from the first response and persisted by the index
# version. `target_pipeline` labels new spaces (embed-v1); the historical
# space the pre-0018 writer produced (direct OpenAI, text-embedding-3-small,
# 384) is embed-v1-legacy and must still be queried with dimensions=384.
#
# Rebuild pacing (owner decisions 7/8, finite): batch_size texts per request,
# >= 1 second between rebuild requests, one rebuild request at a time
# (rebuild_concurrency is validated to stay 1). max_retries=2 means at most 3
# HTTP attempts per chunk on transient network/5xx errors only (retry_delays
# [1,3]s); auth/quota/429 fail after ONE attempt, and SDK-internal retries
# must stay disabled so the policy retry alone limits attempts. Documented
# provider limits win over batch_size. rebuild_claim_ttl_seconds must cover one
# worst-case chunk (validated against timeouts + retry delays: 94s today);
# scan_interval_seconds is how often the worker looks for pending work.
# ---------------------------------------------------------------------------
embedding:
  default:
    provider: openrouter
    model: openai/text-embedding-3-small
  target_pipeline: embed-v1
  batch_size: 32
  rebuild_min_interval_seconds: 1
  rebuild_concurrency: 1
  rebuild_claim_ttl_seconds: 600
  scan_interval_seconds: 5
  request_timeout_seconds: 30
  max_retries: 2
  retry_delays_seconds: [1, 3]

# ---------------------------------------------------------------------------
# Gameplay Settings — runtime behavior
# ---------------------------------------------------------------------------
gameplay:
  context_window_turns: 8        # verbatim turns in DM prompt
  context_token_cap: 12000       # max tokens in DM prompt before oldest verbatim turns are dropped
  npc_verbosity: "medium"        # null=0 minimal=1 low=2 medium=3 high=5 unlimited=999
  compression_enabled: true
  fact_extraction_enabled: true   # background only, used in v2 pgvector search
  semantic_resolver_enabled: false # disabled until v1.5 (NPC filtering + intent classification)
  max_agent_steps: 5
  pgvector_hybrid: false          # enable hybrid RRF search (vector + tsvector) — v1.1 feature flag
  auto_create_npcs: true          # if true, invoke_npc auto-creates missing NPCs
  npc_auto_create_detail: standard # detail level for auto-created NPCs: minimal|standard|rich
  npc_last_interactions_kept: 3   # recent NPC lines kept in world_state per NPC
  npc_condition_max_chars: 80     # cap on the free-form NPC condition descriptor (ADR 0009 A4)
  npc_name_match_threshold: 0.85  # fuzzy cutoff before update_npc may create a new NPC (ADR 0009 B4)
  consecutive_empty_steps_max: 2  # max tool-only steps with no narration before forcing loop exit

# ---------------------------------------------------------------------------
# Resolution — one d20 frame for every check in the game (ADR 0003 A1-A6)
#
# The LLM classifies difficulty into a level and never emits a number; the engine
# draws the modifier from that level's range. total = d20 + character modifier + draw,
# read against the absolute bands below. Ranges are [best, worst]; the ladder is solved
# backwards from the spreads ADR 0003 A3 declares verified, so full-success odds at
# level 1 (+2) run 60/50/40/25/10/nat-20-only.
# ---------------------------------------------------------------------------
resolution:
  outcome_bands: [5, 10, 15]   # <=5 hard_failure | 6-9 soft | 10-14 partial | >=15 full
  char_mod_clamp: [-5, 11]     # total sheet-produced modifier entering the resolver (A6)
  difficulty_levels:
    trivial:         [6, 2]
    easy:            [4, 0]
    normal:          [2, -2]
    hard:            [-1, -5]
    very_hard:       [-4, -8]
    near_impossible: [-9, -13]

# ---------------------------------------------------------------------------
# Combat — statblocks and damage (ADR 0003 B3/B3b/B5/B6)
#
# Everyone hittable is an NPC record with a statblock, the player included. The LLM
# names classes; the engine draws every number. `defense` reuses the six difficulty
# levels above rather than inventing a second scale.
#
# Pacing is calibrated on the level-1 creation presets (~20 HP, best modifier +3):
# three `weak` mooks fall in two solid hits each and take the player down over
# roughly five exchanges.
# ---------------------------------------------------------------------------
combat:
  damage_classes:       {unarmed: 1d2, light: 1d4, medium: 1d8, heavy: 1d12}
  weapon_class_to_stat: {unarmed: STR, light: DEX, medium: STR, heavy: STR}
  tier_damage_scale:                       # multiplier on the class die, by outcome
    critical_success: 2.0
    full_success:     1.0
    partial_success:  0.5                  # never below 1 point
    soft_failure:     0.0
    hard_failure:     0.0
    critical_failure: 0.0
  hp_classes:                              # hp is drawn from the class range
    weak:     [5, 10]
    standard: [14, 22]                     # the player sits here at level 1
    tough:    [35, 55]
    boss:     [80, 140]
  attack_mod_clamp: [-2, 10]
  player_defense_default: normal
  defense_dex_shift:                       # inert until ADR 0010 progression exists
    harder_at: 4                           # DEX mod >= 4 → one level harder to hit
    easier_at: -2                          # DEX mod <= -2 → one level easier
  damage_reduction_cap: 0.75               # ceiling on stacked armor DR (ADR 0010 items)
  statblock_defaults:                      # last resort when class and author say nothing
    npc_class:    commoner
    hp_class:     standard
    defense:      normal
    damage_class: light
    attack_mod:   0
  dead_unnamed_prune:
    after_game_days: 14
    require_empty_inventory: true          # a corpse still holding loot is never pruned

# ---------------------------------------------------------------------------
# Hazards — traps, falls, poison bursts (ADR 0003 B7)
#
# A hazard is an enemy without legs: the DM asks for a reaction roll and the tier
# doses the damage. Classes are percentage ranges of the target's max HP, not dice,
# so a trap stays relevant at every level.
# ---------------------------------------------------------------------------
hazards:
  classes:
    minor:   [0.05, 0.15]
    serious: [0.20, 0.35]
    deadly:  [0.45, 0.70]
  tier_scale:                  # fraction of the drawn damage each outcome takes
    critical_success: 0.0
    full_success:     0.0      # dodged outright
    partial_success:  0.5
    soft_failure:     1.0
    hard_failure:     1.0
    critical_failure: 1.5

# ---------------------------------------------------------------------------
# Healing — percentage of max HP, same asymmetry as hazards (ADR 0003 B7/B7b)
#
# There is no resource economy until ADR 0010/0012, so DM-initiated heals are bounded
# mechanically: the healer must be present in the scene, and dm_heal_cap limits how
# many can land per game day.
# ---------------------------------------------------------------------------
healing:
  classes:
    minor:  [0.10, 0.20]
    strong: [0.30, 0.50]
    full:   [1.00, 1.00]
  dm_heal_cap: 3               # DM-initiated heals per game day

# ---------------------------------------------------------------------------
# Health bands — how the player's HP reaches the DM prompt
#
# 0003 draws every HP number in the engine, so the DM never needs the arithmetic:
# it gets the band the ratio falls in. Numbers in the prompt invite the model to do
# the sums again, which is the failure 0003 closed by construction. The UI keeps
# showing the exact figures. Each entry is the lowest ratio that still earns the band.
# ---------------------------------------------------------------------------
health:
  bands:
    unharmed:   1.00
    grazed:     0.75
    wounded:    0.50
    bloodied:   0.25
    near_death: 0.00

# ---------------------------------------------------------------------------
# Campaign difficulty (ADR 0003 B8)
#
# Difficulty governs the DEATH POLICY only — rolls and damage are identical at every
# setting, so the bands stay calibrated once and hardness comes from the fiction.
# The multipliers are reserved neutral: a future proposal may scale enemy damage
# (facile 0.75 / difficile 1.25), to re-evaluate after playtest.
# ---------------------------------------------------------------------------
campaign_difficulty:
  # easy   — never dies; consequences are narrated instead
  # medium — a few fate interventions at rising cost, then death is final
  # hard   — permadeath from the first fall
  fate_interventions: 3       # medium only: how many times fate steps in
  multipliers:
    easy:    1.0
    medium:  1.0
    hard:    1.0

# ---------------------------------------------------------------------------
# World model (ADR 0008)
# ---------------------------------------------------------------------------
world:
  max_depth: 8            # hard cap on world-tree depth (std 19)
  travel:
    elevation_coeff: 7.92      # Naismith/Scarf: equiv_km = km + coeff * climb_m / 1000
    local_move_minutes: 5      # cost of an interior/containment step (room→room, enter/exit)
  scene:                       # <scene> block (J1/J4) — spine-only, hard token cap
    max_breadcrumb_depth: 4
    show_travel_options: true
    max_travel_options: 6
    include_node_status: true
    description_max_chars: 600
    scene_context_max_tokens: 700

# ---------------------------------------------------------------------------
# API — rate limiting
# ---------------------------------------------------------------------------
api:
  rate_limit:
    turns_per_minute: 10     # max /turns requests per user_id per minute

# ---------------------------------------------------------------------------
# Database migrations — startup/CLI/adoption share one advisory lock
#
# The timeout covers waiting for another process to finish migrating. It is not
# a retry loop: startup waits once, then aborts rather than serving a partial
# schema. Keep it finite; 30 seconds is enough for the current chain.
# ---------------------------------------------------------------------------
migrations:
  lock_timeout_seconds: 30

# ---------------------------------------------------------------------------
# Summarization — retry + deduplication settings
# ---------------------------------------------------------------------------
summarization:
  max_retries: 3                    # retries on LLM failure before marking turn.summarization_failed
  retry_delays_seconds: [1, 3, 10]  # backoff capped at 10s — background task cycle is ~30s

# ---------------------------------------------------------------------------
# Feature Toggles — opt-in AI features (BYOAK — off by default)
# ---------------------------------------------------------------------------
features:
  global_summary:
    enabled: true                # rolling story summary, updated every interval_turns
    mode: llm                    # "rule_based" or "llm"
    interval_turns: 5            # update every N turns
    max_input_chars: 4000        # cap on the existing summary fed back into the update prompt
  npc_enrichment:
    enabled: false               # v1.5+: LLM-enriched NPC profiles before invoke_npc
  world_sim:
    enabled: false               # v2: autonomous world simulation agent

# ---------------------------------------------------------------------------
# Tool Groups — dynamic tool loading per world state
# Conditions: "npcs_present" | "companion_active"
# ---------------------------------------------------------------------------
tool_groups:
  core:
    always: true
    tools:
      - move_to
      - advance_time
      - set_scene_mood
      - log_event
      - update_quest
      - update_npc
      - request_dice     # every d20 check in the game, in or out of combat (ADR 0003 A1)
      - attack           # ADR 0003 B4 — combat is not a mode, so this is always available
      - heal             # ADR 0003 B7 — replaces the free-number update_hp
  social:
    when: npcs_present
    tools:
      - invoke_npc
      - change_npc_psychology
      - kill_npc
      - remove_npc
      - restore_npc
  inventory:
    always: true
    tools:
      - add_item
      - remove_item
