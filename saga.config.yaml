# saga.config.yaml — Game-tunable configuration
#
# Edit this file to change models, gameplay behavior, feature toggles, and tool groups.
# Secrets and infra settings stay in .env / backend/app/config.py (12-factor).
#
# Environment variable overrides (still supported):
#   SAGA_MODEL_DM_NARRATION_LOW_PROVIDER, SAGA_MODEL_DM_NARRATION_HIGH, etc.
#   SAGA_GAMEPLAY_CONTEXT_WINDOW_TURNS, SAGA_GAMEPLAY_NPC_VERBOSITY, etc.
#   SAGA_GLOBAL_PROVIDER, SAGA_GLOBAL_MODEL_HIGH, SAGA_GLOBAL_MODEL_LOW, etc.

# ---------------------------------------------------------------------------
# DM Narration — three-tier routing based on scene importance (0-10)
# ---------------------------------------------------------------------------
dm_narration:
  low:                       # importance 0-3: routine exploration / simple responses
    provider: google
    model: gemini-2.5-pro
    temperature: 0.8
    max_tokens: 2000
  medium:                    # importance 4-6: normal gameplay
    provider: google
    model: gemini-2.5-pro
    temperature: 0.8
    max_tokens: 3000
  high:                      # importance 7-10: boss fights, dramatic reveals
    provider: google
    model: gemini-2.5-pro
    temperature: 0.9
    max_tokens: 4000

# ---------------------------------------------------------------------------
# Companion Dialogue — single tier, conversational
# ---------------------------------------------------------------------------
companion_dialogue:
  default:
    provider: google
    model: gemini-2.5-flash
    temperature: 0.7
    max_tokens: 1500

# ---------------------------------------------------------------------------
# NPC Behavior — budget model, high volume
# ---------------------------------------------------------------------------
npc_behavior:
  default:
    provider: google
    model: gemini-2.5-flash
    temperature: 0.7
    max_tokens: 1000

# ---------------------------------------------------------------------------
# World Simulation — deterministic scoring, lower temperature
# ---------------------------------------------------------------------------
world_sim:
  default:
    provider: google
    model: gemini-2.5-flash
    temperature: 0.5
    max_tokens: 1500

# ---------------------------------------------------------------------------
# Memory Compression — focused summarization
# ---------------------------------------------------------------------------
memory_compression:
  default:
    provider: google
    model: gemini-2.5-flash
    temperature: 0.3
    max_tokens: 500

# ---------------------------------------------------------------------------
# Embeddings
# ---------------------------------------------------------------------------
embedding:
  default:
    provider: google
    model: text-embedding-004
    dimensions: 1536


# ---------------------------------------------------------------------------


# ---------------------------------------------------------------------------
# Gameplay Settings — runtime behavior
# ---------------------------------------------------------------------------
gameplay:
  context_window_turns: 8        # verbatim turns in DM prompt
  context_token_cap: 12000       # max tokens in DM prompt before oldest verbatim turns are dropped
  npc_verbosity: "medium"        # null=0 minimal=1 low=2 medium=3 high=5 unlimited=999
  compression_enabled: true
  fact_extraction_enabled: true   # background only, used in v2 pgvector search
  semantic_resolver_enabled: false # disabled until v1.5 (NPC filtering + intent classification)
  max_agent_steps: 5
  pgvector_hybrid: false          # enable hybrid RRF search (vector + tsvector) — v1.1 feature flag
  auto_create_npcs: true          # if true, invoke_npc auto-creates missing NPCs
  npc_auto_create_detail: standard # detail level for auto-created NPCs: minimal|standard|rich
  npc_last_interactions_kept: 3   # recent NPC lines kept in world_state per NPC
  consecutive_empty_steps_max: 2  # max tool-only steps with no narration before forcing loop exit

# ---------------------------------------------------------------------------
# World model (ADR 0008)
# ---------------------------------------------------------------------------
world:
  max_depth: 8            # hard cap on world-tree depth (std 19)
  travel:
    elevation_coeff: 7.92      # Naismith/Scarf: equiv_km = km + coeff * climb_m / 1000
    local_move_minutes: 5      # cost of an interior/containment step (room→room, enter/exit)
  scene:                       # <scene> block (J1/J4) — spine-only, hard token cap
    max_breadcrumb_depth: 4
    show_travel_options: true
    max_travel_options: 6
    include_node_status: true
    description_max_chars: 600
    scene_context_max_tokens: 700

# ---------------------------------------------------------------------------
# API — rate limiting
# ---------------------------------------------------------------------------
api:
  rate_limit:
    turns_per_minute: 10     # max /turns requests per user_id per minute

# ---------------------------------------------------------------------------
# Summarization — retry + deduplication settings
# ---------------------------------------------------------------------------
summarization:
  max_retries: 3                    # retries on LLM failure before marking turn.summarization_failed
  retry_delays_seconds: [1, 3, 10]  # backoff capped at 10s — background task cycle is ~30s

# ---------------------------------------------------------------------------
# Feature Toggles — opt-in AI features (BYOAK — off by default)
# ---------------------------------------------------------------------------
features:
  global_summary:
    enabled: true                # rolling story summary, updated every interval_turns
    mode: llm                    # "rule_based" or "llm"
    interval_turns: 5            # update every N turns
    max_input_chars: 4000        # cap on the existing summary fed back into the update prompt
  npc_enrichment:
    enabled: false               # v1.5+: LLM-enriched NPC profiles before invoke_npc
  world_sim:
    enabled: false               # v2: autonomous world simulation agent

# ---------------------------------------------------------------------------
# Tool Groups — dynamic tool loading per world state
# Conditions: "combat_active" | "npcs_present" | "companion_active"
# ---------------------------------------------------------------------------
tool_groups:
  core:
    always: true
    tools:
      - move_to
      - advance_time
      - set_scene_mood
      - log_event
      - update_quest
  combat_entry:
    always: true
    tools:
      - start_combat
  combat:
    when: combat_active
    tools:
      - request_dice
      - apply_damage
      - end_combat
      - update_hp
  social:
    when: npcs_present
    tools:
      - invoke_npc
      - change_npc_disposition
  inventory:
    always: true
    tools:
      - add_item
      - remove_item
