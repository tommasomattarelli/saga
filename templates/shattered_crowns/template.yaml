schema_version: "1.0.0"

meta:
  slug: shattered_crowns
  name: "Shattered Crowns"
  description: "Political fantasy in a fractured kingdom. Every faction wants the empty throne — and they all want you on their side."
  author: "SAGA Team"
  version: "1.0.0"
  difficulty: 7
  tags: ["political", "fantasy", "intrigue", "advanced"]
  estimated_hours: 20

world:
  setting: >
    The Kingdom of Valdris has been without a ruler for three months since
    King Aldren's assassination. Four noble houses vie for the Obsidian Throne,
    each with claims of varying legitimacy. The capital, Crownhall, is a
    powder keg of spies, assassins, and desperate diplomats. You arrive as
    an outsider — which makes you the only person everyone might trust.

  locations:
    - name: "Crownhall"
      description: "The grand capital city. Marble towers, crowded markets, and shadows in every alley."
      connections: ["The Obsidian Palace", "Merchant Quarter", "Docks District"]

    - name: "The Obsidian Palace"
      description: "The seat of power, now guarded by a neutral peacekeeping force. The throne sits empty."
      connections: ["Crownhall"]

    - name: "Merchant Quarter"
      description: "Where gold speaks louder than steel. House Velari's stronghold."
      connections: ["Crownhall", "Docks District"]

    - name: "Docks District"
      description: "Salt air and smuggler's havens. House Blacktide's territory."
      connections: ["Crownhall", "Merchant Quarter"]

  factions:
    - name: "House Aurelian"
      description: "The old guard. Traditional, military-minded, believe in birthright."
      disposition: 0

    - name: "House Velari"
      description: "Merchant princes. Wealthy, pragmatic, believe the best ruler is the richest."
      disposition: 2

    - name: "House Blacktide"
      description: "Naval power. Ambitious, ruthless, control the trade routes."
      disposition: -2

    - name: "House Thornwood"
      description: "Rural nobility. Populist, connected to the common folk, distrust the capital."
      disposition: 1

  npcs:
    - name: "Lady Seraphine Aurelian"
      role: "Head of House Aurelian"
      location: "The Obsidian Palace"
      personality: "Regal, cold, calculating. Every word is measured."
      motivation: "Restore her family's claim to the throne through tradition."
      secret: "She knows who killed the king but is using the knowledge as leverage."

    - name: "Doran Velari"
      role: "Merchant prince"
      location: "Merchant Quarter"
      personality: "Charming, generous, always smiling. Never trust the smile."
      motivation: "Buy the throne through economic control."
      secret: "He's bankrupt. His fortune is an illusion of debt and favors."

  companions:
    - name: "Kael"
      personality: "Quiet, observant, loyal once trust is earned. Former soldier."
      background: "A disgraced knight who served under the dead king. Seeks redemption."
      stats:
        hp: 25
        max_hp: 25
        ac: 16
        loyalty: 4
        trust: 3
        mood: "guarded"

opening:
  narration: >
    The gates of Crownhall rise before you like the jaws of some great beast.
    Three months since the king's blood stained the Obsidian Throne, and the
    city hasn't recovered. Guards check papers with paranoid thoroughness.
    Banners of four noble houses hang from every tower, each claiming
    legitimacy, none willing to yield.

    You've come with a letter of introduction — a favor owed by someone
    who knew someone. In Crownhall, that's currency. But here, currency
    has a way of getting spent faster than you'd like.

    A man in dented armor falls into step beside you as you pass through
    the gate. "New in town?" he asks, voice rough. "Name's Kael. Word of
    advice — pick a side before a side picks you. And in this city, being
    picked isn't always survivable."

  location: "Crownhall"
  time_of_day: "afternoon"
  weather: "overcast"

  initial_quests:
    - name: "The Game of Crowns"
      description: "Navigate the political landscape of Crownhall. Every faction wants an ally."
      objectives:
        - "Meet representatives of at least two noble houses"
        - "Learn the public claims to the throne"
        - "Find lodging in the city"

story_arcs:
  - name: "The King's Truth"
    trigger: "Player investigates the assassination"
    description: "Uncovering who really killed King Aldren — and why."

  - name: "The Empty Throne"
    trigger: "Player gains 7+ reputation with any faction"
    description: "A faction asks you to help them claim the throne."
