meta:
  slug: tutorial
  name: "The Awakening"
  description: "A tutorial scenario that introduces game mechanics through a mysterious awakening in a forest shrine."
  author: "SAGA Team"
  version: "1.0.0"
  difficulty: 3
  tags: ["tutorial", "fantasy", "beginner"]
  estimated_hours: 2

world:
  setting: >
    A verdant forest surrounds the ancient Shrine of First Light, where travelers
    sometimes awaken with no memory of how they arrived. The nearby village of
    Thornhaven sits at a crossroads, its people wary of strangers but not unkind.
    Dark rumors speak of something stirring in the old mines to the north.

  locations:
    - name: "Shrine of First Light"
      description: "An ancient stone circle in a forest clearing. Moss-covered pillars hum with faint magic."
      connections: ["Forest Path", "Thornhaven"]

    - name: "Thornhaven"
      description: "A small village of timber-and-stone buildings. A tavern, a smithy, and a market square."
      connections: ["Shrine of First Light", "Forest Path", "North Road"]

    - name: "Forest Path"
      description: "A winding trail through tall oaks and ferns. Dappled sunlight filters through the canopy."
      connections: ["Shrine of First Light", "Thornhaven"]

    - name: "North Road"
      description: "A muddy road leading toward the abandoned mines. Crows watch from dead trees."
      connections: ["Thornhaven", "Old Mines"]

    - name: "Old Mines"
      description: "Abandoned iron mines. The entrance is boarded up, but boards have been recently broken."
      connections: ["North Road"]

  factions:
    - name: "Thornhaven Council"
      description: "The village elders who govern Thornhaven."
      disposition: 0

    - name: "The Hollow"
      description: "A mysterious group operating from the old mines."
      disposition: -5

  npcs:
    - name: "Marta"
      role: "Tavern keeper"
      location: "Thornhaven"
      personality: "Warm but shrewd. Knows everyone's business."
      motivation: "Protect her village and her livelihood."
      secret: "She found a strange artifact in the mines years ago and hid it."

    - name: "Aldric"
      role: "Village elder"
      location: "Thornhaven"
      personality: "Stern, formal, deeply concerned about the mine situation."
      motivation: "Keep order and protect the village."
      secret: "His son went to investigate the mines and hasn't returned."

  companions:
    - name: "Lyra"
      personality: "Curious, impulsive, brave. Quick to act, sometimes too quick."
      background: "A young ranger who patrols the forest. Found you at the shrine."
      stats:
        hp: 15
        max_hp: 15
        ac: 13
        loyalty: 6
        trust: 5
        mood: "curious"

opening:
  narration: >
    Your eyes open to a canopy of ancient oaks. Sunlight filters through
    the leaves in golden shafts, and the air smells of moss and wildflowers.
    You're lying on cold stone — a circular platform surrounded by weathered
    pillars carved with symbols you almost recognize.

    Your head throbs. You remember... nothing. Not your name, not how you
    got here, not why your hand grips the hilt of a sword you don't remember
    owning.

    A young woman in forest-green leather crouches nearby, watching you with
    sharp eyes. "Easy," she says, a hand raised. "You've been out for hours.
    I'm Lyra. I found you here at dawn." She glances at the pillars. "This
    place... people don't just wake up here by accident."

    Behind her, a path winds into the forest. In the distance, you can hear
    the faint sound of a village — hammering, a rooster crowing.

    "Can you stand?" Lyra asks. "Thornhaven isn't far. You look like you
    could use a meal and some answers."

  location: "Shrine of First Light"
  time_of_day: "morning"
  weather: "clear"

  initial_quests:
    - name: "Who Am I?"
      description: "Discover your identity and why you woke at the Shrine of First Light."
      objectives:
        - "Explore the shrine for clues"
        - "Ask the villagers of Thornhaven about recent events"
        - "Investigate your belongings for any hints"

story_arcs:
  - name: "The Hollow Threat"
    trigger: "Player learns about the mines from villagers"
    description: "Something dark stirs in the old mines. The village needs help."

  - name: "The Lost Son"
    trigger: "Player speaks with Aldric"
    description: "Elder Aldric's son went to the mines and hasn't returned."

  - name: "Marta's Secret"
    trigger: "Player gains Marta's trust (loyalty 8+)"
    description: "The tavern keeper has an artifact connected to the shrine."
