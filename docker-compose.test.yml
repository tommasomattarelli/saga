services:
  db_test:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: saga_test
      POSTGRES_PASSWORD: saga_test
      POSTGRES_DB: saga_test
    ports:
      - "5433:5432"
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    # Use tmpfs for ultra-fast, non-persistent test data
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U saga_test" ]
      interval: 2s
      timeout: 2s
      retries: 10
